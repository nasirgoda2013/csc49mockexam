function bitsTable(str){
  const n=str.length; return '<div class="bt">'+str.split('').map((b,i)=>`<span class="${b==='1'?'on':''}"><small>${2**(n-1-i)}</small>${b}</span>`).join('')+'</div><br>';
}
function explainHTML(q){ return q.explain.replace(/^BITS:([01]+)\s*/, (m,b)=>bitsTable(b)); }

/* ===================== CSC40 MOCK EXAM ===================== */
const EXAM={code:'CSC40', title:'CSC40 Milestone 3 – Mock Exam', subject:'Computing Systems & Networks and Modern AI', count:Object.keys(Q).length, key:'csc40-mock-exam-all-v1', pass:60};
const PW_HASH='5d9199be';
function fnv(s){ let x=0x811c9dc5; for(const c of s){ x^=c.codePointAt(0); x=Math.imul(x,0x01000193)>>>0; } return x.toString(16).padStart(8,'0'); }
const pwOk=p=>fnv('x9|'+fnv('csc40-exam|'+p)+'|'+p)===PW_HASH;

let S=null;                 // exam state (saved to localStorage)
let unlocked=false;         // true after the teacher password lets the page close
let lockOpen=false;
const $a=()=>$('#app');
const save=()=>{ try{ localStorage.setItem(EXAM.key, JSON.stringify(S)); }catch(e){} };
const load=()=>{ try{ return JSON.parse(localStorage.getItem(EXAM.key)||'null'); }catch(e){ return null; } };
const clearState=()=>{ try{ localStorage.removeItem(EXAM.key); }catch(e){} S=null; };
const stemText=q=>q.stem.replace(/\[\[(.+?)\]\]/g,'$1');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtT=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const active=()=>S&&S.started&&!S.submitted;

/* ---------- Full screen ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function enterFS(){ const d=document.documentElement; try{ const r=(d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); if(r&&r.catch) r.catch(()=>flagNoFS()); }catch(e){ flagNoFS(); } }
function exitFS(){ try{ if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document); }catch(e){} }
function flagNoFS(){ const b=$('#fsbanner'); if(b) b.hidden=false; }
function warn(kind){ if(!active()||unlocked) return; S.warnings.push({kind, t:Date.now()}); save(); showLock(kind); }
document.addEventListener('fullscreenchange',()=>{ if(!fsEl()) warn('Left full screen'); else { const b=$('#fsbanner'); if(b) b.hidden=true; } });
document.addEventListener('webkitfullscreenchange',()=>{ if(!fsEl()) warn('Left full screen'); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) warn('Switched tab or window'); });
window.addEventListener('blur',()=>{ if(active()&&!unlocked&&!lockOpen&&!document.hidden) warn('Clicked outside the exam'); });
window.addEventListener('beforeunload',e=>{ if(active()&&!unlocked){ e.preventDefault(); e.returnValue=''; return ''; } });
['contextmenu','copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev,e=>{ if(S&&S.started&&!unlocked&&!e.target.closest('input')) e.preventDefault(); }));
document.addEventListener('keydown',e=>{
  if(!(S&&S.started)||unlocked) return;
  const k=e.key.toLowerCase(), c=e.ctrlKey||e.metaKey;
  const block = k==='f5'||k==='f12'||(c&&['r','p','s','u','c','x','a','f','o','w','n','t'].includes(k)&&!e.target.closest('input'))||(c&&e.shiftKey&&['i','j','c','k'].includes(k))||(e.altKey&&['arrowleft','arrowright','home'].includes(k));
  if(block){ e.preventDefault(); e.stopPropagation(); }
},true);

/* ---------- Password modal ---------- */
function askPassword(title, onOk, onCancel){
  const m=document.createElement('div'); m.className='pwmodal'; m.innerHTML=`<div class="pwbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>🔒 ${title}</h2><p>Teacher password required.</p><input type="password" class="num pwin" autocomplete="off" aria-label="Password"><p class="pwerr" hidden>Wrong password.</p><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Unlock</button></div></div>`;
  document.body.appendChild(m); const inp=$('.pwin',m); inp.focus();
  const ok=()=>{ if(pwOk(inp.value)){ m.remove(); onOk(); } else { inp.value=''; $('.pwerr',m).hidden=false; const b=$('.pwbox',m); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); if(S){ S.pwFails=(S.pwFails||0)+1; save(); } inp.focus(); } };
  $('[data-ok]',m).addEventListener('click',ok); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); });
  $('[data-x]',m).addEventListener('click',()=>{ m.remove(); if(onCancel) onCancel(); });
}

/* ---------- Lock screen ---------- */
function showLock(reason){
  if(lockOpen) return; lockOpen=true;
  const L=document.createElement('div'); L.className='lockscreen'; L.innerHTML=`<div class="lockbox"><div class="lock-ic">🔒</div><h2>The exam is locked</h2><p><b>${esc(reason)}.</b> This has been recorded (${S.warnings.length} warning${S.warnings.length===1?'':'s'}).</p><p>Your answers are safe. Return to the exam now.</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary big" data-back>↩ Return to the exam (full screen)</button></div><button class="linkbtn" data-teach>Teacher: unlock to exit</button></div>`;
  document.body.appendChild(L);
  $('[data-back]',L).addEventListener('click',()=>{ L.remove(); lockOpen=false; enterFS(); });
  $('[data-teach]',L).addEventListener('click',()=>askPassword('Exit the exam',()=>{ L.remove(); lockOpen=false; teacherPanel(); }));
}

/* ---------- Screens ---------- */
function viewStart(){
  $a().innerHTML=`<div class="exwrap"><div class="excard start"><p class="hero-sub">${EXAM.code} · ${EXAM.subject}</p><h1>${EXAM.title}</h1>
   <ul class="rules">${[`All ${EXAM.count} questions from the question bank, in a random order. Answers are shuffled.`,'Choose one answer for each question. You can change answers before you submit.','No hints and no feedback during the exam.','The exam runs in full screen. Leaving full screen or switching windows locks the exam and is recorded.','Your result appears after you answer all questions and submit.'].map(x=>`<li class="ok">✔ ${x}</li>`).join('')}</ul>
   <div class="formgrid"><label>Full name<input class="num" data-name autocomplete="off" maxlength="60"></label><label>Student ID / class<input class="num" data-sid autocomplete="off" maxlength="30"></label></div>
   <label class="agree"><input type="checkbox" data-agree> I have read the rules and I am ready.</label>
   <div class="row" style="margin-top:14px"><button class="btn primary big" data-start disabled>▶ Start the exam in full screen</button></div><p class="pwerr" data-err hidden></p></div>
   <button class="linkbtn corner" data-t>🔒 Teacher</button></div>`;
  const chk=()=>{ $('[data-start]').disabled=!($('[data-name]').value.trim()&&$('[data-sid]').value.trim()&&$('[data-agree]').checked); };
  ['input','change'].forEach(ev=>$a().addEventListener(ev,chk));
  $('[data-start]').addEventListener('click',()=>{
    const pick=shuffle(Object.keys(Q)).slice(0,EXAM.count);
    S={name:$('[data-name]').value.trim(), sid:$('[data-sid]').value.trim(), ids:pick, order:pick.map(id=>shuffle([0,1,2,3].slice(0,Q[id].opts.length))), ans:Array(pick.length).fill(null), i:0, start:Date.now(), started:true, submitted:false, warnings:[], reloads:0};
    save(); enterFS(); viewExam();
  });
  $('[data-t]').addEventListener('click',()=>askPassword('Teacher panel',teacherPanel));
}
function viewResume(){
  $a().innerHTML=`<div class="exwrap"><div class="excard start"><div class="lock-ic">⏸️</div><h1>Exam in progress</h1><p><b>${esc(S.name)}</b> (${esc(S.sid)}), ${S.ans.filter(a=>a!==null).length} of ${S.ids.length} answered.</p><p class="tipline">The page was reloaded or reopened. This has been recorded. You will get the same questions and your saved answers.</p><div class="row" style="margin-top:14px"><button class="btn primary big" data-go>↩ Continue the exam in full screen</button></div></div><button class="linkbtn corner" data-t>🔒 Teacher</button></div>`;
  $('[data-go]').addEventListener('click',()=>{ enterFS(); viewExam(); });
  $('[data-t]').addEventListener('click',()=>askPassword('Teacher panel',teacherPanel));
}
let tickT=null;
function viewExam(){
  const n=S.ids.length;
  $a().innerHTML=`<div class="exbar"><div><b>${esc(S.name)}</b> <span class="tipline">${esc(S.sid)}</span></div><div class="exstat"><span>⏱️ <b data-time>0:00</b></span><span>✍️ <b data-cnt></b> / ${n} answered</span></div><button class="linkbtn" data-t>🔒 Teacher</button></div>
   <p id="fsbanner" class="fsbanner" hidden>⚠️ Full screen is not active. <button class="btn small" data-fs>Go full screen</button></p>
   <div class="exwrap wide"><div class="palette" data-pal></div><div data-q></div>
   <div class="rv-nav"><button class="btn" data-prev>⟵ Previous</button><button class="btn" data-next>Next ⟶</button></div>
   <div class="submitbar"><button class="btn primary big" data-sub>✅ Submit the exam</button><span class="tipline" data-subhint></span></div></div>`;
  $('[data-t]').addEventListener('click',()=>askPassword('Teacher panel',teacherPanel));
  $('[data-fs]').addEventListener('click',enterFS);
  $('[data-prev]').addEventListener('click',()=>{ if(S.i>0){ S.i--; save(); drawQ(); } });
  $('[data-next]').addEventListener('click',()=>{ if(S.i<n-1){ S.i++; save(); drawQ(); } });
  $('[data-sub]').addEventListener('click',confirmSubmit);
  clearInterval(tickT); tickT=setInterval(()=>{ const t=$('[data-time]'); if(t) t.textContent=fmtT(Date.now()-S.start); },1000);
  if(!fsEl()) later(400,()=>{ if(!fsEl()) flagNoFS(); });
  drawQ();
}
function drawQ(){
  const n=S.ids.length, id=S.ids[S.i], q=Q[id], ord=S.order[S.i], L='ABCD';
  const fig='';
  $('[data-q]').innerHTML=`<article class="q exq"><div class="q-head"><span class="q-num">Question ${S.i+1} of ${n}</span></div><div class="q-stem">${stemText(q)}</div>${q.extra||''}${fig}
   <div class="opts" role="radiogroup" aria-label="Answer options">${ord.map((oi,k)=>`<button class="opt ${S.ans[S.i]===oi?'chosen':''}" role="radio" aria-checked="${S.ans[S.i]===oi}" data-oi="${oi}"><span class="opt-l">${L[k]}</span><span class="opt-t">${q.opts[oi][0]}</span></button>`).join('')}</div></article>`;
  $$('.opt').forEach(b=>b.addEventListener('click',()=>{ S.ans[S.i]=+b.dataset.oi; save(); drawQ(); }));
  const done=S.ans.filter(a=>a!==null).length;
  $('[data-cnt]').textContent=done;
  $('[data-pal]').innerHTML=S.ids.map((_,k)=>`<button class="qdot ${S.ans[k]!==null?'ok':''} ${k===S.i?'now':''}" data-k="${k}" aria-label="Question ${k+1}${S.ans[k]!==null?', answered':''}">${k+1}</button>`).join('');
  $$('[data-k]').forEach(d=>d.addEventListener('click',()=>{ S.i=+d.dataset.k; save(); drawQ(); }));
  $('[data-prev]').disabled=S.i===0; $('[data-next]').disabled=S.i===n-1;
  $('[data-sub]').disabled=done<n; $('[data-subhint]').textContent=done<n?`Answer all ${n} questions to submit (${n-done} left).`:'All questions answered. You can submit.';
}
function confirmSubmit(){
  const m=document.createElement('div'); m.className='pwmodal'; m.innerHTML=`<div class="pwbox" role="dialog" aria-modal="true"><h2>Submit the exam?</h2><p>You cannot change your answers after submitting.</p><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-x>Go back</button><button class="btn primary" data-ok>Yes, submit</button></div></div>`;
  document.body.appendChild(m);
  $('[data-x]',m).addEventListener('click',()=>m.remove());
  $('[data-ok]',m).addEventListener('click',()=>{ m.remove(); const score=S.ans.filter(a=>a===0).length; S.submitted=true; S.end=Date.now(); S.score=score; save(); clearInterval(tickT); viewResult(); });
}
function viewResult(){
  const n=S.ids.length, pct=Math.round(S.score/n*100), pass=pct>=EXAM.pass;
  $a().innerHTML=`<div class="exwrap"><div class="excard result"><p class="hero-sub">${EXAM.title}</p><h1>Your result</h1>
   <div class="ring ${pass?'pass':'fail'}" style="--p:${pct}"><div><b>${S.score} / ${n}</b><span>${pct}%</span></div></div>
   <p class="resmsg">${pct>=90?'🌟 Outstanding!':pct>=75?'🎉 Very good work!':pass?'👍 Well done, you passed.':'Keep practising. You can do better next time.'}</p>
   <table class="dtable restbl"><tr><td>Student</td><td><b>${esc(S.name)}</b></td></tr><tr><td>ID / class</td><td>${esc(S.sid)}</td></tr><tr><td>Date</td><td>${new Date(S.end).toLocaleString('en-GB')}</td></tr><tr><td>Time taken</td><td>${fmtT(S.end-S.start)}</td></tr><tr><td>Warnings (left full screen / switched)</td><td>${S.warnings.length}${S.reloads?` · reloads: ${S.reloads}`:''}</td></tr></table>
   ${n-S.score?`<div class="row" style="justify-content:center;margin:6px 0 10px"><button class="btn primary big" data-rev>📖 Review my incorrect answers (${n-S.score})</button></div>`:'<p class="resmsg" style="font-size:1rem">✅ You have no incorrect answers.</p>'}
   <p class="tipline">Please stay in your seat. Your teacher will close the exam.</p></div><button class="linkbtn corner" data-t>🔒 Teacher</button></div>`;
  $('[data-t]').addEventListener('click',()=>askPassword('Teacher panel',teacherPanel));
  const rv=$('[data-rev]'); if(rv) rv.addEventListener('click',()=>viewReview('wrong'));
}
function viewReview(mode){
  const n=S.ids.length, L='ABCD', wrongN=n-S.score;
  const list=S.ids.map((id,k)=>({id,k})).filter(x=>mode==='all'||S.ans[x.k]!==0);
  $a().innerHTML=`<div class="exbar"><div><b>📖 Review</b> <span class="tipline">${esc(S.name)} · ${S.score} / ${n}</span></div><button class="btn small" data-back>⟵ Back to my result</button></div>
   <div class="exwrap wide"><div class="row" style="justify-content:space-between;margin:6px 0 14px"><div class="seg" data-g="m"><button data-m="wrong" class="${mode==='wrong'?'on':''}">❌ Incorrect only (${wrongN})</button><button data-m="all" class="${mode==='all'?'on':''}">📋 All ${n} questions</button></div>
   <div class="legend-r"><span class="lg your">✘ Your answer</span><span class="lg right">✔ Correct answer</span></div></div>
   ${list.length?list.map(({id,k})=>{ const q=Q[id], a=S.ans[k], ord=S.order[k], ok=a===0;
     const fig='';
     return `<article class="q exq rvq ${ok?'isok':'iswrong'}"><div class="q-head"><span class="q-num">Question ${k+1}</span><span class="rvtag ${ok?'ok':'no'}">${ok?'✔ Correct':'✘ Incorrect'}</span></div><div class="q-stem">${stemText(q)}</div>${q.extra||''}${fig}
      <div class="opts">${ord.map((oi,j)=>{ const cls=oi===0?'right':(oi===a?'yours':'dim'); return `<div class="opt rvopt ${cls}"><span class="opt-l">${L[j]}</span><span class="opt-t">${q.opts[oi][0]}${oi===0?'<span class="rvmark ok">✔ Correct answer</span>':oi===a?'<span class="rvmark no">✘ Your answer</span>':''}</span></div>`; }).join('')}</div>
      ${a===null?'<p class="rvwhy no">You did not answer this question.</p>':''}
      ${!ok&&a!==null&&q.opts[a][2]?`<p class="rvwhy no"><b>Why your answer is wrong:</b> ${q.opts[a][2]}</p>`:''}
      <p class="rvwhy ok"><b>Why the correct answer is right:</b> ${explainHTML(q)}</p></article>`; }).join(''):'<div class="excard result"><p class="resmsg">✅ No incorrect answers.</p></div>'}
   <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-back2>⟵ Back to my result</button></div></div>`;
  $('[data-back]').addEventListener('click',viewResult); $('[data-back2]').addEventListener('click',viewResult);
  segBind($a(),'[data-g="m"]',b=>{ viewReview(b.dataset.m); window.scrollTo(0,0); });
  window.scrollTo(0,0);
}
function teacherPanel(){
  const m=document.createElement('div'); m.className='pwmodal'; const has=!!S;
  const rows=has&&S.submitted?S.ids.map((id,k)=>{ const q=Q[id], a=S.ans[k], ok=a===0, L='ABCD', ord=S.order[k]; const letter=oi=>L[ord.indexOf(oi)];
    return `<tr class="${ok?'':'badrow'}"><td>${k+1}</td><td>${q.src}</td><td>${a===null?'—':letter(a)+'. '+plain(q.opts[a][0]).slice(0,60)}</td><td>${letter(0)}. ${plain(q.opts[0][0]).slice(0,60)}</td><td>${ok?'✔':'✘'}</td></tr>`; }).join(''):'';
  m.innerHTML=`<div class="pwbox wide" role="dialog" aria-modal="true"><h2>🧑‍🏫 Teacher panel</h2>
   ${has?`<p><b>${esc(S.name)}</b> (${esc(S.sid)}) · ${S.submitted?`<b>${S.score} / ${S.ids.length}</b> (${Math.round(S.score/S.ids.length*100)}%)`:`in progress: ${S.ans.filter(a=>a!==null).length} / ${S.ids.length} answered`} · warnings: ${S.warnings.length} · wrong passwords: ${S.pwFails||0}</p>`:'<p>No exam in progress on this computer.</p>'}
   ${has&&S.warnings.length?`<details><summary>Warning log (${S.warnings.length})</summary><ul class="wlog">${S.warnings.map(w=>`<li>${new Date(w.t).toLocaleTimeString('en-GB')}: ${esc(w.kind)}</li>`).join('')}</ul></details>`:''}
   ${rows?`<details><summary>Answers, question by question</summary><div class="dt-wrap"><table class="dtable"><tr><th>#</th><th>Sheet</th><th>Student answer</th><th>Correct answer</th><th></th></tr>${rows}</table></div></details>`:''}
   <div class="tbtns">${has&&!S.submitted?'<button class="btn" data-c>↩ Continue the exam</button>':''}<button class="btn" data-exit>🚪 Unlock and leave full screen</button><button class="btn danger" data-new>🧹 Clear and start a new student</button><button class="btn" data-close>Close</button></div>
   <p class="tipline">“Clear” deletes this student’s exam from this computer. Write down the result first.</p></div>`;
  document.body.appendChild(m);
  const c=$('[data-c]',m); if(c) c.addEventListener('click',()=>{ m.remove(); enterFS(); });
  $('[data-close]',m).addEventListener('click',()=>{ m.remove(); if(active()&&!fsEl()) showLock('Teacher panel closed'); });
  $('[data-exit]',m).addEventListener('click',()=>{ unlocked=true; m.remove(); exitFS(); const b=document.createElement('div'); b.className='unlockbar'; b.innerHTML='🔓 Unlocked by the teacher. The browser can now be closed.'; document.body.appendChild(b); });
  $('[data-new]',m).addEventListener('click',()=>{ const was=unlocked; unlocked=true; const okc=confirm('Delete this exam from this computer and start a new student?'); if(!okc){ unlocked=was; return; } m.remove(); clearState(); unlocked=false; clearInterval(tickT); viewStart(); });
}

/* ---------- Boot ---------- */
(function boot(){
  S=load();
  if(!S||!S.started) viewStart();
  else if(S.submitted) viewResult();
  else { S.reloads=(S.reloads||0)+1; S.warnings.push({kind:'Page reloaded or reopened', t:Date.now()}); save(); viewResume(); }
})();

</script>
</body>
</html>
